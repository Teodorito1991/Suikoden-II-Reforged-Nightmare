name: Managed regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  managed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run retained managed regression suite
        run: dotnet run --project tests/NightmareRebalance.Tests.csproj -c Release
      - name: Verify fresh campaign configuration
        shell: pwsh
        run: ./tools/test-fresh-campaign.ps1
      - name: Audit publication source tree
        run: python tools/audit-publication.py
