## Example only. Actual CFG is nightmare.suikoden2.reforged.cfg, generated by BepInEx.
[Difficulty]
EnemyHpMultiplier = 1.6
EnemyDamageMultiplier = 1.45
ExperienceMultiplier = 1
PotchMultiplier = 0.85

[Rune Regeneration]
EnableRuneRegeneration = true
RuneChargesPerVictory = 1
RuneRecoveryPriority = LowestDepletedLevel
# Legacy default4; Full Content Preview explicitly recommends2.
RuneRecoveryMaxLevel = 4
RequireSurvivingCharacter = true

[Diagnostics]
EnableDebugLogging = false
EnableBossDiagnostics = false

[Features]
EnableScriptedBossOverrides = false
EnableBossProfiles = false
EnableRuneBalancing = true
EnableCharacterBalancing = true
EnableEnemyProfiles = true
EnableEnemyTargeting = true
EnableWarUnitProfiles = true

[Developer]
# Explicit hunt-test protection; F7 remains unavailable unless enabled.
EnableHuntDebugTools = false
EnableDeveloperTools = false

[Boss Profiles]
BossProfilePath = NightmareRebalance/boss-profiles.json
EnableBossProfileDiagnostics = false
FallbackToGlobalNightmare = true

[Arena]
EnableWarArena = false

[Native War]
# Experimental normal-build ownership contract. Keep off until validated.
# EnableTrainingDefeatReturn is optional; without it a training defeat is a Game Over.
EnableTrainingWar = false
EnableTrainingNormalBuild = false
EnableTrainingDefeatReturn = false
EnableNativeWarRemix = true
RunNativeWarSelfTest = false
EnableNativeWarAI = true
EnableWarSpecializations = true
EnableWarTactics = true
# Optional additions to Castle Army Training in the copied runtime.
EnableTrainingVeteran = true
EnableTrainingRewards = true

[Enemy AI]
EnemyTargetHealthThreshold = 0.5

[Combat Reforged]
EnableCombatReforgedAi = true
RunCombatSelfTest = false
# Edit ReforgedNightmare/combat-reforged.json for separate pacing, boss, healing and sleep controls.

[Hall of Echoes]
UnlockAllBosses = false
# Original clear observed; defeat/Nightmare/repeat acceptance still pending.
EnableHall_luca_gauntlet = false
EnableHallOfEchoes = false
EnableHallHarpy = false

# v1.1 content switches and per-entry settings are in ReforgedNightmare/combat-evolution.json.
# Enabled=false disables only the new formation/boss-phase/additional-boss/Unite layer.
# Keep RunCombatSelfTest=false and RunNativeWarSelfTest=false for normal play.

# v1.49 additions: each still requires its source-backed story/bonus gate.
EnableHall_bone_dragon = false
EnableHall_celestial_sword = false
EnableHall_neclord_final = false
EnableHall_lucia_retinue = false
EnableHall_lucia_highland = false
EnableHall_gorudo = false
EnableHall_seed_culgan = false
EnableHall_double_head = false
EnableHall_mist_shade = false
EnableHall_lucia_castle = false
EnableHall_rowd_patrol = false
EnableHall_worm_moth = false
EnableHall_beast_rune = false

[Army Progression]
EnableArmyProgression = false
EnableDrillDirectives = false
EnableCrossTheaterSynergy = false

[Castle Guild]
EnableExpandedCastleNpcs = false
